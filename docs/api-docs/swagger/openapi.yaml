openapi: 3.1.0

info:
  title: An's DBMS Database Object API
  version: 1.0.0
  description: |
    REST API for managing the main database objects in An's DBMS.

    Supported resources:

    * Database
    * Schema
    * Table
    * Column
    * View
    * Index
    * Constraint

    Resource hierarchy:

    Database
      └── Schema
          ├── Table
          │   ├── Column
          │   ├── Constraint
          │   └── Index
          └── View

  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Databases
    description: Database lifecycle and metadata operations

  - name: Schemas
    description: Schema metadata operations

  - name: Tables
    description: Table metadata operations

  - name: Columns
    description: Column metadata operations

  - name: Views
    description: View metadata operations

  - name: Indexes
    description: Index metadata operations

  - name: Constraints
    description: Constraint metadata operations

paths:

  # =========================================================
  # Database
  # =========================================================

  /databases:
    post:
      tags:
        - Databases
      summary: Create a database
      operationId: createDatabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        '201':
          description: Database created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Databases
      summary: List all databases
      operationId: listDatabases
      responses:
        '200':
          description: Databases retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/{databaseId}:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'

    get:
      tags:
        - Databases
      summary: Get a database by ID
      operationId: getDatabase
      responses:
        '200':
          description: Database retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Databases
      summary: Delete a database
      operationId: deleteDatabase
      responses:
        '204':
          description: Database deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /databases/{databaseId}/name:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'

    patch:
      tags:
        - Databases
      summary: Rename a database
      operationId: renameDatabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameDatabaseRequest'
      responses:
        '200':
          description: Database renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /databases/{databaseId}/open:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'

    post:
      tags:
        - Databases
      summary: Open a database
      operationId: openDatabase
      responses:
        '200':
          description: Database opened successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /databases/{databaseId}/close:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'

    post:
      tags:
        - Databases
      summary: Close a database
      operationId: closeDatabase
      responses:
        '200':
          description: Database closed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /databases/{databaseId}/read-only:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'

    patch:
      tags:
        - Databases
      summary: Change the database read-only mode
      operationId: setDatabaseReadOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetReadOnlyRequest'
      responses:
        '200':
          description: Read-only mode updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # =========================================================
  # Schema
  # =========================================================

  /databases/{databaseId}/schemas:
    parameters:
      - $ref: '#/components/parameters/DatabaseId'

    post:
      tags:
        - Schemas
      summary: Create a schema inside a database
      operationId: createSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchemaRequest'
      responses:
        '201':
          description: Schema created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags:
        - Schemas
      summary: List schemas in a database
      operationId: listSchemas
      responses:
        '200':
          description: Schemas retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /schemas/{schemaId}:
    parameters:
      - $ref: '#/components/parameters/SchemaId'

    get:
      tags:
        - Schemas
      summary: Get a schema by ID
      operationId: getSchema
      responses:
        '200':
          description: Schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
              example:
                id: f72e902a-eb22-4421-99fa-a43b48105bfc
                databaseId: 72e787cc-3d1d-4330-8806-8a13ccbf0928
                name: sales
                tableCount: 0
                viewCount: 0
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Schemas
      summary: Delete a schema
      operationId: deleteSchema
      responses:
        '204':
          description: Schema deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /schemas/{schemaId}/name:
    parameters:
      - $ref: '#/components/parameters/SchemaId'

    patch:
      tags:
        - Schemas
      summary: Rename a schema
      operationId: renameSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSchemaRequest'
      responses:
        '200':
          description: Schema renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /schemas/{schemaId}/copies:
    parameters:
      - $ref: '#/components/parameters/SchemaId'

    post:
      tags:
        - Schemas
      summary: Copy a schema
      operationId: copySchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopySchemaRequest'
      responses:
        '201':
          description: Schema copied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # =========================================================
  # Table
  # =========================================================

  /schemas/{schemaId}/tables:
    parameters:
      - $ref: '#/components/parameters/SchemaId'

    post:
      tags:
        - Tables
      summary: Create a table inside a schema
      operationId: createTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          description: Table created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags:
        - Tables
      summary: List tables in a schema
      operationId: listTables
      responses:
        '200':
          description: Tables retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableId'

    get:
      tags:
        - Tables
      summary: Get a table by ID
      operationId: getTable
      responses:
        '200':
          description: Table retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Tables
      summary: Delete a table
      operationId: deleteTable
      responses:
        '204':
          description: Table deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tables/{tableId}/name:
    parameters:
      - $ref: '#/components/parameters/TableId'

    patch:
      tags:
        - Tables
      summary: Rename a table
      operationId: renameTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTableRequest'
      responses:
        '200':
          description: Table renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tables/{tableId}/copies:
    parameters:
      - $ref: '#/components/parameters/TableId'

    post:
      tags:
        - Tables
      summary: Copy table metadata
      operationId: copyTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTableRequest'
      responses:
        '201':
          description: Table copied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # =========================================================
  # Column
  # =========================================================

  /tables/{tableId}/columns:
    parameters:
      - $ref: '#/components/parameters/TableId'

    post:
      tags:
        - Columns
      summary: Add a column to a table
      operationId: createColumn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '201':
          description: Column created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags:
        - Columns
      summary: List columns in a table
      operationId: listColumns
      responses:
        '200':
          description: Columns retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /tables/{tableId}/columns/{columnId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/ColumnId'

    get:
      tags:
        - Columns
      summary: Get a column by ID
      operationId: getColumn
      responses:
        '200':
          description: Column retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Columns
      summary: Update column metadata
      operationId: updateColumn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateColumnRequest'
      responses:
        '200':
          description: Column updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags:
        - Columns
      summary: Remove a column from a table
      operationId: deleteColumn
      responses:
        '204':
          description: Column deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tables/{tableId}/columns/{columnId}/name:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/ColumnId'

    patch:
      tags:
        - Columns
      summary: Rename a column
      operationId: renameColumn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameColumnRequest'
      responses:
        '200':
          description: Column renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # =========================================================
  # View
  # =========================================================

  /schemas/{schemaId}/views:
    parameters:
      - $ref: '#/components/parameters/SchemaId'

    post:
      tags:
        - Views
      summary: Create a view inside a schema
      operationId: createView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateViewRequest'
      responses:
        '201':
          description: View created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags:
        - Views
      summary: List views in a schema
      operationId: listViews
      responses:
        '200':
          description: Views retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /schemas/{schemaId}/views/{viewId}:
    parameters:
      - $ref: '#/components/parameters/SchemaId'
      - $ref: '#/components/parameters/ViewId'

    get:
      tags:
        - Views
      summary: Get a view by ID
      operationId: getView
      responses:
        '200':
          description: View retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Views
      summary: Delete a view
      operationId: deleteView
      responses:
        '204':
          description: View deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /schemas/{schemaId}/views/{viewId}/name:
    parameters:
      - $ref: '#/components/parameters/SchemaId'
      - $ref: '#/components/parameters/ViewId'

    patch:
      tags:
        - Views
      summary: Rename a view
      operationId: renameView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameViewRequest'
      responses:
        '200':
          description: View renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /schemas/{schemaId}/views/{viewId}/definition:
    parameters:
      - $ref: '#/components/parameters/SchemaId'
      - $ref: '#/components/parameters/ViewId'

    patch:
      tags:
        - Views
      summary: Update a view definition
      operationId: updateViewDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateViewDefinitionRequest'
      responses:
        '200':
          description: View definition updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /schemas/{schemaId}/views/{viewId}/refresh:
    parameters:
      - $ref: '#/components/parameters/SchemaId'
      - $ref: '#/components/parameters/ViewId'

    post:
      tags:
        - Views
      summary: Refresh a materialized view
      operationId: refreshView
      responses:
        '200':
          description: View refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # =========================================================
  # Index
  # =========================================================

  /tables/{tableId}/indexes:
    parameters:
      - $ref: '#/components/parameters/TableId'

    post:
      tags:
        - Indexes
      summary: Create an index on a table
      operationId: createIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndexRequest'
      responses:
        '201':
          description: Index created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags:
        - Indexes
      summary: List indexes on a table
      operationId: listIndexes
      responses:
        '200':
          description: Indexes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /indexes/{indexId}:
    parameters:
      - $ref: '#/components/parameters/IndexId'

    get:
      tags:
        - Indexes
      summary: Get an index by ID
      operationId: getIndex
      responses:
        '200':
          description: Index retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Indexes
      summary: Delete an index
      operationId: deleteIndex
      responses:
        '204':
          description: Index deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /indexes/{indexId}/name:
    parameters:
      - $ref: '#/components/parameters/IndexId'

    patch:
      tags:
        - Indexes
      summary: Rename an index
      operationId: renameIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameIndexRequest'
      responses:
        '200':
          description: Index renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /indexes/{indexId}/rebuild:
    parameters:
      - $ref: '#/components/parameters/IndexId'

    post:
      tags:
        - Indexes
      summary: Rebuild an index
      operationId: rebuildIndex
      responses:
        '200':
          description: Index rebuilt successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # =========================================================
  # Constraint
  # =========================================================

  /tables/{tableId}/constraints:
    parameters:
      - $ref: '#/components/parameters/TableId'

    post:
      tags:
        - Constraints
      summary: Create a constraint on a table
      operationId: createConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConstraintRequest'
      responses:
        '201':
          description: Constraint created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags:
        - Constraints
      summary: List constraints on a table
      operationId: listConstraints
      responses:
        '200':
          description: Constraints retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConstraintResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /constraints/{constraintId}:
    parameters:
      - $ref: '#/components/parameters/ConstraintId'

    get:
      tags:
        - Constraints
      summary: Get a constraint by ID
      operationId: getConstraint
      responses:
        '200':
          description: Constraint retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Constraints
      summary: Delete a constraint
      operationId: deleteConstraint
      responses:
        '204':
          description: Constraint deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /constraints/{constraintId}/name:
    parameters:
      - $ref: '#/components/parameters/ConstraintId'

    patch:
      tags:
        - Constraints
      summary: Rename a constraint
      operationId: renameConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConstraintRequest'
      responses:
        '200':
          description: Constraint renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /constraints/{constraintId}/validate:
    parameters:
      - $ref: '#/components/parameters/ConstraintId'

    post:
      tags:
        - Constraints
      summary: Validate a constraint
      operationId: validateConstraint
      responses:
        '200':
          description: Constraint validation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintValidationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  # =========================================================
  # Parameters
  # =========================================================

  parameters:
    DatabaseId:
      name: databaseId
      in: path
      required: true
      description: Database identifier
      schema:
        type: string
        format: uuid

    SchemaId:
      name: schemaId
      in: path
      required: true
      description: Schema identifier
      schema:
        type: string
        format: uuid

    TableId:
      name: tableId
      in: path
      required: true
      description: Table identifier
      schema:
        type: string
        format: uuid

    ColumnId:
      name: columnId
      in: path
      required: true
      description: Column identifier
      schema:
        type: string
        format: uuid

    ViewId:
      name: viewId
      in: path
      required: true
      description: View identifier
      schema:
        type: string
        format: uuid

    IndexId:
      name: indexId
      in: path
      required: true
      description: Index identifier
      schema:
        type: string
        format: uuid

    ConstraintId:
      name: constraintId
      in: path
      required: true
      description: Constraint identifier
      schema:
        type: string
        format: uuid

  # =========================================================
  # Reusable Responses
  # =========================================================

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  # =========================================================
  # Schemas
  # =========================================================

  schemas:

    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Schema was not found
        path:
          type: string
          example: /api/v1/schemas/123
        validationErrors:
          type: array
          items:
            type: string

    # Database DTOs

    CreateDatabaseRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: customer_database

    RenameDatabaseRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1
          example: customer_management

    SetReadOnlyRequest:
      type: object
      required:
        - readOnly
      properties:
        readOnly:
          type: boolean
          example: true

    DatabaseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          $ref: '#/components/schemas/DatabaseStateType'
        readOnly:
          type: boolean
        schemaCount:
          type: integer
          minimum: 0

    DatabaseStateType:
      type: string
      enum:
        - CLOSED
        - OPEN
        - READ_ONLY

    # Schema DTOs

    CreateSchemaRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: sales
        ownerId:
          type:
            - string
            - 'null'
          format: uuid

    RenameSchemaRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1
          example: sales_management

    CopySchemaRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1
          example: sales_backup

    SchemaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        databaseId:
          type: string
          format: uuid
        ownerId:
          type:
            - string
            - 'null'
          format: uuid
        name:
          type: string
        tableCount:
          type: integer
          minimum: 0
        viewCount:
          type: integer
          minimum: 0

    # Table DTOs

    CreateTableRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: customers

    RenameTableRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1
          example: customer_accounts

    CopyTableRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1
          example: customers_backup
        targetSchemaId:
          type:
            - string
            - 'null'
          format: uuid

    TableResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schemaId:
          type: string
          format: uuid
        name:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnResponse'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintResponse'
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/IndexResponse'

    # Column DTOs

    CreateColumnRequest:
      type: object
      required:
        - name
        - dataType
        - nullable
      properties:
        name:
          type: string
          minLength: 1
          example: email
        dataType:
          $ref: '#/components/schemas/DataType'
        nullable:
          type: boolean
          example: false
        defaultValue: {}
        position:
          type: integer
          minimum: 0
        length:
          type:
            - integer
            - 'null'
          minimum: 1
        precision:
          type:
            - integer
            - 'null'
          minimum: 1
        scale:
          type:
            - integer
            - 'null'
          minimum: 0
        identity:
          type: boolean
          default: false

    RenameColumnRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1
          example: contact_email

    UpdateColumnRequest:
      type: object
      properties:
        dataType:
          $ref: '#/components/schemas/DataType'
        nullable:
          type:
            - boolean
            - 'null'
        defaultValue: {}
        length:
          type:
            - integer
            - 'null'
        precision:
          type:
            - integer
            - 'null'
        scale:
          type:
            - integer
            - 'null'

    ColumnResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        name:
          type: string
        dataType:
          $ref: '#/components/schemas/DataType'
        nullable:
          type: boolean
        defaultValue: {}
        position:
          type: integer
        length:
          type:
            - integer
            - 'null'
        precision:
          type:
            - integer
            - 'null'
        scale:
          type:
            - integer
            - 'null'
        identity:
          type: boolean

    DataType:
      type: string
      enum:
        - BOOLEAN
        - INTEGER
        - BIGINT
        - DECIMAL
        - FLOAT
        - DOUBLE
        - CHAR
        - VARCHAR
        - TEXT
        - DATE
        - TIME
        - TIMESTAMP
        - UUID
        - BINARY
        - JSON

    # View DTOs

    CreateViewRequest:
      type: object
      required:
        - name
        - definition
      properties:
        name:
          type: string
          minLength: 1
          example: active_customers
        definition:
          type: string
          minLength: 1
          example: SELECT * FROM customers WHERE active = true
        materialized:
          type: boolean
          default: false

    RenameViewRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1
          example: enabled_customers

    UpdateViewDefinitionRequest:
      type: object
      required:
        - definition
      properties:
        definition:
          type: string
          minLength: 1

    ViewResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schemaId:
          type: string
          format: uuid
        name:
          type: string
        definition:
          type: string
        dependencyIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        materialized:
          type: boolean
        valid:
          type: boolean

    # Index DTOs

    CreateIndexRequest:
      type: object
      required:
        - name
        - type
        - columnIds
        - unique
      properties:
        name:
          type: string
          minLength: 1
          example: idx_customers_email
        type:
          $ref: '#/components/schemas/IndexType'
        columnIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        unique:
          type: boolean

    RenameIndexRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1

    IndexResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/IndexType'
        columnIds:
          type: array
          items:
            type: string
            format: uuid
        unique:
          type: boolean

    IndexType:
      type: string
      enum:
        - BTREE
        - HASH
        - BITMAP

    # Constraint DTOs

    CreateConstraintRequest:
      type: object
      required:
        - name
        - type
        - columnIds
      properties:
        name:
          type: string
          minLength: 1
          example: fk_orders_customer
        type:
          $ref: '#/components/schemas/ConstraintType'
        columnIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        referencedTableId:
          type:
            - string
            - 'null'
          format: uuid
        referencedColumnIds:
          type: array
          items:
            type: string
            format: uuid
        expression:
          type:
            - string
            - 'null'

    RenameConstraintRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
          minLength: 1

    ConstraintResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/ConstraintType'
        columnIds:
          type: array
          items:
            type: string
            format: uuid
        referencedTableId:
          type:
            - string
            - 'null'
          format: uuid
        referencedColumnIds:
          type: array
          items:
            type: string
            format: uuid
        expression:
          type:
            - string
            - 'null'

    ConstraintValidationResponse:
      type: object
      properties:
        constraintId:
          type: string
          format: uuid
        valid:
          type: boolean
        violationCount:
          type: integer
          format: int64
          minimum: 0
        violations:
          type: array
          items:
            type: string

    ConstraintType:
      type: string
      enum:
        - PRIMARY_KEY
        - FOREIGN_KEY
        - UNIQUE
        - NOT_NULL
        - CHECK