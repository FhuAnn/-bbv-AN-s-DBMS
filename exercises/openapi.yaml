    post:
      summary: Add new customer
      operationId: createCustomer
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              $ref:'#/components/schemas/CreateCustomerRequest'
            example:
              company_name: "Linear"
              domain: "linear.app"
              category: "Developer Tools"
              description: "The issue tracking tool you'll enjoy using."
      responses:
        '201': 
          desciption: Create new customer successfully
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/CustomerItem"
  
  /customers/export:
    get:
      summary: "Export customer list"
      operationId: exportCustomers
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
      responses:
        '200': 
          description: Export file successfully
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /users/me:
    get:
      tags:
        - Current user
      summary: Get current autheticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200": 
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
              example:
                - id: "user-001"
                  fullName: "Sophia Munn",
                  email: "sophia@untitled.com",
                  avatarUrl: "https://example.com/avatars/sophia.png"
                  role: "STORE_ADMIN",
                  storeId: "store-001"
        "401":
          description: User is not authenticated

      patch:
        tags:
          - Current id
        summary: Update current user profile
        operationId: updateCurrentUser
        security:
          - bearerAuth: []
        requestBody:
          required: true
          content: 
            application/json:
              schema:
                $ref: "#components/schemas/UpdateCurrentUserRequest"
        responses:
          "200":
            description: User profile updated successfully
            content: 
              application/json:
                schema:
                  $ref: "#/components/schemas/CurrentUser"
      
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out current user
      operationId: logout
      security:
       - bearerAuth: []
      responses:
        "204":
          description: Logged out successfully

        

components:

  # =========================================================
  # Parameters
  # =========================================================
  schemas:
    MetricsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            status:
              type: string
              example: sucess
            data: 
              type: object
              properties:
                total_customers:
                  $ref: "#/components/schemas/MetricDetail"
                members:
                  $ref: "#/components/schemas/MetricsDetail"
                active_now:
                  type: object
                  properties:
                    value:
                      type: integer
                      example: 316
                    recent_active_users:
                      type: array
                      items:
                        $ref: "#/components/schemas/UserAvatar"

    MetricDetail:
      type: object
      properties:
        value:
          type: integer
          example: 8486
        change_percentage:
          type: number
          format: float
          example: 20.0
        trend:
          type: string
          enum: [up,down]
          example: "up"
    
    UserAvatar:
      type: object
      properties:
        id: 
          type: string
          example: "usr_101"
        name:
          type: string
          example: "Sophia Munn"
        avatar_url:
          type: string
          example: "https://example.com/avatars/user1.jpa"

          # Customer list schemas
    
    CustomerListResponse:
      type: object
      properties:
        status: 
          type: string
          example: "success"
        data: 
          type: array
          items:
            $ref: "#/components/schemas/CustomerItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
    
    CustomerItem:
      type: object
      properties:
        id: 
          type: string
          example: "cust_framer_01"
        company:
          type: object
          properties:
            name:
              type: string
              example: "Framer"
            domain:
              type: string
              example: "framer.com"
            logo_url:
              type: string
              example: "https://example.com/logos/framer.png"
            status:
              type: string
              enum: [Customer, Churned]
              example: "Customer"
            about:
              type: object
              properties: 
                category: 
                  type: string
                  example: "Design tool"
                description:
                  type: string
                  example: "Make beautiful websites in minutes."
            users:
              type: object
              properties:
                total_count:
                  type: integer
                  example: 9
                preview:
                  type: array
                  items: 
                    $ref: "#/compoents/schemas/UserAvatar"
                remaining_count:
                  type: integer
                  example: 4
    
    CreateCustomerRequest:
      type: object
      required:
        - company_name
        - domain
      properties:
        company_name: 
          type: string
          example: Framer
        domain:
          type: string
          example: "framer.com"
        category:
          type: string
          example: "Make beautiful websites in minutes"

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 7
        total_records:
          type: integer
          example: 8486
        total_pages:
          type: integer
          example: 1210
        has_next:
          type: boolean
          example: true
        has_previous:
          type: boolean
          example: false
      
    CurrentUser:
      type: object
      required:
        - id 
        - fullname
        - email
        - role
      properties:
        id:
          type: string
          example: user-001
        fullName:
          type: string
          example: Sophia Munn
        email:
          type: string
          format: email
          example: sophia@untitled.com
        avatarUrl:
          type: string
          formar: uri
        role:
          type: string
          enum: 
            - STORE_OWNER
            - STORE_ADMIN
            - STORE_MEMBER
        storeId:
          type: string
          example: store-001
    
    UpdateCurrentUserRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Sophia Munn
        
        avatarUrl:
          type: string
          format: uri
    
    securitySchemes:
      bearAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
            